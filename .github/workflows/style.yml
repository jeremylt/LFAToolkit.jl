name: Style tests

on:
  push:
  pull_request:

jobs:
  styletest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        julia-version: ['1']
    steps:
      - name: Environment setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Julia setup
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}
      - name: Julia cache
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Check style
        run: julia .Style.jl --color=yes && git diff --exit-code src test examples docs
